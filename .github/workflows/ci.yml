name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Hooks run on the user's machine, and the failures that cost the most in this
    # kind of tool are platform ones: paths, line endings, a stdin that never closes.
    # Node 20 is the oldest version `engines` promises; 24 is the current one.
    # The repository is private, so the matrix is kept to five jobs: macOS minutes
    # are billed at ten times the Linux rate.
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 24 }
          - { os: windows-latest, node: 20 }
          - { os: windows-latest, node: 24 }
          - { os: macos-latest, node: 22 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run bench:selftest
