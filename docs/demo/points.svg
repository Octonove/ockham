<rect width="1000" height="596" rx="12" fill="#0d1117"/>
<rect width="1000" height="40" rx="12" fill="#161b22"/><rect y="28" width="1000" height="12" fill="#161b22"/>
<circle cx="24" cy="20" r="6" fill="#f85149"/><circle cx="44" cy="20" r="6" fill="#d29922"/><circle cx="64" cy="20" r="6" fill="#3fb950"/>
<text x="500" y="25" text-anchor="middle" style="fill:#8b949e;font-size:13px">The reward you have exactly the points for · two recorded sessions, sonnet</text>
<text x="32" y="74" class="ticket first">ticket  Bug: a customer with exactly 100 points cannot redeem the 100-point reward at checkout. Having</text>
<text x="32" y="98" class="ticket">        the points a reward costs is enough. Fix it.</text>
<line x1="488" y1="108" x2="488" y2="574" class="rule"/>
<text x="32" y="134" class="title" style="animation:a0 17.90s linear infinite">WITHOUT OCKHAM</text>
<text x="32" y="158" style="animation:a1 17.90s linear infinite"><tspan class="mark">› </tspan><tspan class="tool">Grep</tspan><tspan class="path"> "points"</tspan></text>
<text x="32" y="182" style="animation:a2 17.90s linear infinite"><tspan class="mark">› </tspan><tspan class="tool">Read</tspan><tspan class="path"> src/loyalty/redeem.js</tspan></text>
<text x="32" y="206" style="animation:a3 17.90s linear infinite"><tspan class="mark">› </tspan><tspan class="tool">Edit</tspan><tspan class="path"> src/loyalty/redeem.js</tspan></text>
<text x="32" y="230" class="says" style="animation:a4 17.90s linear infinite">Fixed: redeemable used strict &gt;, so a customer</text>
<text x="32" y="254" class="says" style="animation:a5 17.90s linear infinite">with exactly 100 points failed the 100-point</text>
<text x="32" y="278" class="says" style="animation:a6 17.90s linear infinite">reward check. Changed to &gt;= in</text>
<text x="32" y="302" class="says" style="animation:a7 17.90s linear infinite">src/loyalty/redeem.js:9.</text>
<text x="32" y="542" class="fail" style="animation:a8 17.90s linear infinite">hidden check: ✗ one place fixed, the other left wrong</text>
<text x="32" y="566" class="cost" style="animation:a9 17.90s linear infinite">4 turns · 1 line of code · no test · $0.019</text>
<text x="512" y="134" class="title" style="animation:a10 17.90s linear infinite">WITH OCKHAM</text>
<text x="512" y="158" class="ockham" style="animation:a11 17.90s linear infinite">Ockham: here are the 24 helpers this project</text>
<text x="512" y="182" class="ockham" style="animation:a12 17.90s linear infinite">shares, and where its tests are</text>
<text x="512" y="206" style="animation:a13 17.90s linear infinite"><tspan class="mark">› </tspan><tspan class="tool">Read</tspan><tspan class="path"> src/loyalty/redeem.js</tspan></text>
<text x="512" y="230" style="animation:a14 17.90s linear infinite"><tspan class="mark">› </tspan><tspan class="tool">Edit</tspan><tspan class="path"> src/loyalty/redeem.js</tspan></text>
<text x="512" y="254" class="ockham" style="animation:a15 17.90s linear infinite">Ockham: what this change replaces is also in</text>
<text x="512" y="278" class="ockham" style="animation:a16 17.90s linear infinite">src/emails/points.js:5</text>
<text x="512" y="302" style="animation:a17 17.90s linear infinite"><tspan class="mark">› </tspan><tspan class="tool">Read</tspan><tspan class="path"> src/emails/points.js</tspan></text>
<text x="512" y="326" style="animation:a18 17.90s linear infinite"><tspan class="mark">› </tspan><tspan class="tool">Glob</tspan><tspan class="path"> "test/*.js"</tspan></text>
<text x="512" y="350" style="animation:a19 17.90s linear infinite"><tspan class="mark">› </tspan><tspan class="tool">Read</tspan><tspan class="path"> test/redeem.test.js</tspan></text>
<text x="512" y="374" style="animation:a20 17.90s linear infinite"><tspan class="mark">› </tspan><tspan class="tool">Edit</tspan><tspan class="path"> src/emails/points.js</tspan></text>
<text x="512" y="398" style="animation:a21 17.90s linear infinite"><tspan class="mark">› </tspan><tspan class="tool">Edit</tspan><tspan class="path"> test/redeem.test.js</tspan></text>
<text x="512" y="422" class="says" style="animation:a22 17.90s linear infinite">Fixed redeemable() in src/loyalty/redeem.js to</text>
<text x="512" y="446" class="says" style="animation:a23 17.90s linear infinite">use &gt;= instead of &gt;, so exact-cost redemptions</text>
<text x="512" y="470" class="says" style="animation:a24 17.90s linear infinite">work. Also updated src/emails/points.js, which</text>
<text x="512" y="494" class="says" style="animation:a25 17.90s linear infinite">duplicated the same buggy comparison, to reuse …</text>
<text x="512" y="542" class="pass" style="animation:a26 17.90s linear infinite">hidden check: ✓ passes</text>
<text x="512" y="566" class="cost" style="animation:a27 17.90s linear infinite">8 turns · 3 lines of code · a test · $0.053</text>
</svg>
