<rect width="1000" height="596" rx="12" fill="#0d1117"/>
<rect width="1000" height="40" rx="12" fill="#161b22"/><rect y="28" width="1000" height="12" fill="#161b22"/>
<circle cx="24" cy="20" r="6" fill="#f85149"/><circle cx="44" cy="20" r="6" fill="#d29922"/><circle cx="64" cy="20" r="6" fill="#3fb950"/>
<text x="500" y="25" text-anchor="middle" style="fill:#8b949e;font-size:13px">renderNote with a template string · two recorded sessions, sonnet</text>
<text x="32" y="74" class="ticket first">ticket  renderNote in src/notes/render.js builds its HTML by adding strings one after another. Rewrite</text>
<text x="32" y="98" class="ticket">        it with a template string so it is short and clear, without changing what it does.</text>
<line x1="488" y1="108" x2="488" y2="574" class="rule"/>
<text x="32" y="134" class="title" style="animation:a0 17.90s linear infinite">WITHOUT OCKHAM</text>
<text x="32" y="158" style="animation:a1 17.90s linear infinite"><tspan class="mark">› </tspan><tspan class="tool">Read</tspan><tspan class="path"> src/notes/render.js</tspan></text>
<text x="32" y="182" style="animation:a2 17.90s linear infinite"><tspan class="mark">› </tspan><tspan class="tool">Edit</tspan><tspan class="path"> src/notes/render.js</tspan></text>
<text x="32" y="206" class="says" style="animation:a3 17.90s linear infinite">Rewritten as a single template literal,</text>
<text x="32" y="230" class="says" style="animation:a4 17.90s linear infinite">preserving the exact same output (including the</text>
<text x="32" y="254" class="says" style="animation:a5 17.90s linear infinite">conditional &lt;time&gt; element).</text>
<text x="32" y="542" class="pass" style="animation:a6 17.90s linear infinite">hidden check: ✓ passes</text>
<text x="32" y="566" class="cost" style="animation:a7 17.90s linear infinite">3 turns · 3 lines of code · no test · $0.018</text>
<text x="512" y="134" class="title" style="animation:a8 17.90s linear infinite">WITH OCKHAM</text>
<text x="512" y="158" class="ockham" style="animation:a9 17.90s linear infinite">Ockham: here are the 24 helpers this project</text>
<text x="512" y="182" class="ockham" style="animation:a10 17.90s linear infinite">shares, and where its tests are</text>
<text x="512" y="206" style="animation:a11 17.90s linear infinite"><tspan class="mark">› </tspan><tspan class="tool">Read</tspan><tspan class="path"> src/notes/render.js</tspan></text>
<text x="512" y="230" style="animation:a12 17.90s linear infinite"><tspan class="mark">› </tspan><tspan class="tool">Edit</tspan><tspan class="path"> src/notes/render.js</tspan></text>
<text x="512" y="254" class="ockham" style="animation:a13 17.90s linear infinite">Ockham, before you finish: no test was added or</text>
<text x="512" y="278" class="ockham" style="animation:a14 17.90s linear infinite">changed</text>
<text x="512" y="302" style="animation:a15 17.90s linear infinite"><tspan class="mark">› </tspan><tspan class="tool">Glob</tspan><tspan class="path"> "test/*.test.js"</tspan></text>
<text x="512" y="326" style="animation:a16 17.90s linear infinite"><tspan class="mark">› </tspan><tspan class="tool">Read</tspan><tspan class="path"> src/notes/escape.js</tspan></text>
<text x="512" y="350" style="animation:a17 17.90s linear infinite"><tspan class="mark">› </tspan><tspan class="tool">Read</tspan><tspan class="path"> test/checkout.test.js</tspan></text>
<text x="512" y="374" style="animation:a18 17.90s linear infinite"><tspan class="mark">› </tspan><tspan class="tool">Write</tspan><tspan class="path"> test/notes.test.js</tspan></text>
<text x="512" y="398" class="ockham" style="animation:a19 17.90s linear infinite">Ockham: it dealt with all of it, and stopped</text>
<text x="512" y="422" class="says" style="animation:a20 17.90s linear infinite">Added test/notes.test.js, checking that</text>
<text x="512" y="446" class="says" style="animation:a21 17.90s linear infinite">renderNote escapes HTML in author/day/text (the</text>
<text x="512" y="470" class="says" style="animation:a22 17.90s linear infinite">attacker-reachable case) and still omits &lt;time&gt;</text>
<text x="512" y="494" class="says" style="animation:a23 17.90s linear infinite">when there's no day. Reused the existing test …</text>
<text x="512" y="542" class="pass" style="animation:a24 17.90s linear infinite">hidden check: ✓ passes</text>
<text x="512" y="566" class="cost" style="animation:a25 17.90s linear infinite">8 turns · 3 lines of code · a test · $0.054</text>
</svg>
